image: debian:trixie

stages:
    - build
    - release

variables:
    DEBIAN_FRONTEND: noninteractive
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ethercat/${CI_COMMIT_TAG}"

before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        build-essential devscripts debhelper dh-dkms
        autoconf automake libtool pkg-config
        linux-headers-amd64
        ca-certificates curl

deb:trixie:
    stage: build
    script:
        - dpkg-buildpackage -us -uc -b
        - mkdir -p debs
        - mv ../*.deb debs/
        - mv ../*.buildinfo debs/ || true
        - mv ../*.changes debs/ || true
        - ls -la debs/
    artifacts:
        paths:
            - debs/
        expire_in: 1 month

upload:
    stage: release
    rules:
        - if: $CI_COMMIT_TAG
    needs:
        - job: deb:trixie
          artifacts: true
    script:
        - |
            for f in debs/*.deb; do
                name=$(basename "$f")
                curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
                    --fail-with-body \
                    --upload-file "$f" \
                    "${PACKAGE_REGISTRY_URL}/${name}"
            done

release:
    stage: release
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    rules:
        - if: $CI_COMMIT_TAG
    needs:
        - job: upload
    before_script: []
    script:
        - echo "Creating release $CI_COMMIT_TAG"
    release:
        name: "Release $CI_COMMIT_TAG"
        tag_name: "$CI_COMMIT_TAG"
        description: "EtherCAT $CI_COMMIT_TAG Debian trixie packages"

workflow:
    rules:
        - if: $CI_MERGE_REQUEST_IID
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH
